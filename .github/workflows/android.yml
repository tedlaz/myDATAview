name: Build Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          npm run typecheck

      - name: Set version
        id: version
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Το tag $GITHUB_REF_NAME δεν συμφωνεί με την έκδοση $version του app.json" >&2
            exit 1
          fi
          # Το Android δέχεται αναβάθμιση μόνο με μεγαλύτερο versionCode.
          node -e "const f=require('fs'),a=JSON.parse(f.readFileSync('app.json'));a.expo.android.versionCode=+process.env.GITHUB_RUN_NUMBER;f.writeFileSync('app.json',JSON.stringify(a,null,2))"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Λείπει το secret ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          sign() {
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$2" "$1"
            "$tools/apksigner" verify "$2"
          }
          input=android/app/build/outputs/apk/release/app-release.apk
          sign "$input" emulator.apk
          # Το APK που δημοσιεύεται: μόνο 64-bit ARM, χωρίς τα x86_64 του εξομοιωτή.
          cp "$input" arm64.apk
          zip -q -d arm64.apk 'lib/x86_64/*'
          "$tools/zipalign" -f -P 16 4 arm64.apk aligned.apk
          sign aligned.apk "myDATAview-${{ steps.version.outputs.version }}.apk"
          ls -la *.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Το APK δημοσιεύεται μόνο αν ανοίγει: στο release ένα σφάλμα εκκίνησης ρίχνει την εφαρμογή.
      - name: Open the APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r emulator.apk
            adb logcat -c
            adb shell monkey -p com.tedlaz.mydataview -c android.intent.category.LAUNCHER 1
            sleep 45
            adb logcat -d > logcat.txt
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png screen.png
            adb shell dumpsys package com.tedlaz.mydataview > package.txt
            adb shell pidof com.tedlaz.mydataview > pid.txt || true
            test -s pid.txt

      - name: Crash log
        if: failure()
        run: grep -n -E 'FATAL EXCEPTION|ReactNativeJS|AndroidRuntime' logcat.txt | head -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator
          path: |
            logcat.txt
            screen.png
            package.txt
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: myDATAview-apk
          path: myDATAview-*.apk
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" myDATAview-*.apk --clobber

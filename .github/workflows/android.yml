name: Build Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          npm run typecheck

      - name: Set version
        id: version
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Το tag $GITHUB_REF_NAME δεν συμφωνεί με την έκδοση $version του app.json" >&2
            exit 1
          fi
          # Το Android δέχεται αναβάθμιση μόνο με μεγαλύτερο versionCode.
          node -e "const f=require('fs'),a=JSON.parse(f.readFileSync('app.json'));a.expo.android.versionCode=+process.env.GITHUB_RUN_NUMBER;f.writeFileSync('app.json',JSON.stringify(a,null,2))"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Λείπει το secret ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "myDATAview-${{ steps.version.outputs.version }}.apk" \
            android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify "myDATAview-${{ steps.version.outputs.version }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: myDATAview-apk
          path: myDATAview-*.apk
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" myDATAview-*.apk --clobber

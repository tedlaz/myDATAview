name: Smoke test APK

# Εγκαθιστά ένα δημοσιευμένο APK σε εξομοιωτή Android, το ανοίγει και κρατά το log.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (για παράδειγμα v1.0.0)
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output app.apk
          ls -la app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p com.tedlaz.mydataview -c android.intent.category.LAUNCHER 1
            sleep 40
            adb logcat -d > logcat.txt
            adb shell pidof com.tedlaz.mydataview > pid.txt || true
            test -s pid.txt

      - name: Show crash
        if: always()
        run: |
          grep -n -E 'FATAL EXCEPTION|ReactNativeJS|AndroidRuntime|Hermes|Unhandled|Error:|Exception' logcat.txt | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: logcat.txt
          retention-days: 7
